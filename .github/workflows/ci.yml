name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: depo-ui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation / Node ${{ matrix.node }} / pnpm ${{ matrix.pnpm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.19.0']
        pnpm: ['11.25.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node }}'

      - name: Activate pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${{ matrix.pnpm }}
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency boundaries
        run: pnpm lint:deps

      - name: Governance and release dry run
        run: pnpm governance:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
